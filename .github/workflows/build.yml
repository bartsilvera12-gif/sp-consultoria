name: Build (dist para Hostinger)

# Compila el sitio en la nube (no necesitas Node en tu PC) y deja la
# carpeta dist/ actualizada en el repositorio, lista para subir a Hostinger.
# Se ejecuta en cada push a main y tambien manualmente desde la pestaña Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build (genera dist/)
        run: npm run build

      - name: Commitear carpeta dist/ al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --staged --quiet; then
            echo "Sin cambios en dist/, no hay nada que commitear."
          else
            git commit -m "chore: actualizar carpeta dist para Hostinger [skip ci]"
            git push
          fi
